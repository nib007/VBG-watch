name: GP TTELA VBG watch

on:
  schedule:
    - cron: '0 */4 * * *'

  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests

      - name: Run watcher
        run: |
          python ../rss_watch.py
